# ============================================================
# Render blueprint - the CineSphere API.
#
# The database is deliberately NOT declared here: it lives on Neon, whose
# free Postgres does not expire, whereas a Render free database does. The
# three SPRING_DATASOURCE_* values are marked `sync: false`, which tells
# Render to prompt for them once and never store them in this file.
# ============================================================
services:
  - type: web
    name: cinesphere-api
    runtime: docker
    repo: https://github.com/prasadkasande/CineSphere
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Must match the Neon project's region (AWS US East 2, Ohio). The database
    # is on the far side of every query, so putting the app in a different
    # continent adds ~230ms to each one - far more than the geographic distance
    # to the user costs.
    region: ohio
    # Public GET, so it answers before anyone has signed in.
    healthCheckPath: /api/movies
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://cinesphere.prasadkasande.uk
      # Secrets: entered in the Render dashboard, never committed.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      # Render generates a strong value on first deploy and keeps it stable.
      - key: APP_JWT_SECRET
        generateValue: true
