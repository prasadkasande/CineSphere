# Production stack for the VPS. Mirrors the portfolio-backend project next to
# it on purpose - same shape, same conventions, so the box stays predictable.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets come from a .env file beside this one (see .env.example); nothing
# sensitive lives in this file. Neither service publishes a port: Postgres is
# reachable only on the internal network, and the API only by the shared Caddy
# proxy (/opt/proxy) over the external "web" network.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinesphere
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d cinesphere"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  cinesphere-api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Spring's relaxed binding maps these onto spring.datasource.*
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cinesphere
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # The browser only ever talks to the Vercel origin, which rewrites
      # /api and /uploads here - but set this correctly anyway so a direct
      # call from the site is not rejected.
      APP_CORS_ALLOWED_ORIGINS: https://cinesphere.prasadkasande.uk
    # Cap it so this app can never starve the portfolio backend beside it.
    mem_limit: 768m
    networks: [internal, web]

volumes:
  db_data:

networks:
  internal:
  web:
    external: true
