spring.application.name=app

# Railway (and most PaaS) inject the port to bind as $PORT; 8081 is the local
# default because 8080 is taken by another app on the dev machine.
server.port=${PORT:8081}

# H2 file-based database - persists under backend/data/
spring.datasource.url=jdbc:h2:file:./data/movieticket;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT. Overridden in production by APP_JWT_SECRET - this default is a
# development convenience and must never be the deployed value.
app.jwt.secret=change-this-super-secret-key-for-movie-ticket-app-min-256-bits-long
app.jwt.expiration-ms=86400000

# Browser origins allowed to call the API. In production this is set via
# APP_CORS_ALLOWED_ORIGINS (the deployed frontend's origin).
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Uploaded cover images
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Seed data on first run
app.seed.enabled=true
app.seed.admin-email=admin@movieticket.com
app.seed.admin-password=Admin@123
