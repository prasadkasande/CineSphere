# ============================================================
# Production profile - activated with SPRING_PROFILES_ACTIVE=prod
#
# Everything secret or environment-specific arrives as an environment
# variable, not from this file. Spring's relaxed binding maps them
# automatically, so only the values that genuinely differ from the
# development defaults are restated here:
#
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD   the Postgres service
#   APP_JWT_SECRET                                  signing key
#   APP_CORS_ALLOWED_ORIGINS                        the deployed frontend
#   APP_UPLOAD_DIR                                  the mounted volume
#   PORT                                            injected by the platform
# ============================================================

spring.datasource.driver-class-name=org.postgresql.Driver

# The dev profile ships an H2 console; never expose one in production.
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Postgres names identifiers in lower case; leave quoting to Hibernate's
# default strategy so the schema matches what ddl-auto creates.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Fail fast and loudly rather than serving a half-initialised app.
spring.datasource.hikari.initialization-fail-timeout=10000

# Errors returned to the browser must not leak stack traces.
server.error.include-stacktrace=never
server.error.include-message=always
